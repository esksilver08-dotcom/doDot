name: iOS Build + Simulator Screenshot

on:
  push:
  workflow_dispatch:

jobs:
  screenshot:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Pick an available iPhone simulator
        id: sim
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available | grep -m1 "iPhone" | grep -oE '[0-9A-F]{8}-([0-9A-F]{4}-){3}[0-9A-F]{12}')
          if [ -z "$UDID" ]; then
            echo "No available iPhone simulator found" >&2
            xcrun simctl list devices available >&2
            exit 1
          fi
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices available | grep -m1 "iPhone"

      - name: Boot simulator
        run: |
          xcrun simctl boot "${{ steps.sim.outputs.udid }}"
          xcrun simctl bootstatus "${{ steps.sim.outputs.udid }}" -b

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project mailmeil.xcodeproj \
            -scheme mailmeil \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO

      - name: Install and launch app
        run: |
          set -euo pipefail
          APP_PATH=$(find build/Build/Products -maxdepth 3 -name "mailmeil.app" | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "Built .app not found" >&2
            exit 1
          fi
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$APP_PATH"
          xcrun simctl launch "${{ steps.sim.outputs.udid }}" go.mailmeil
          sleep 5

      - name: Take screenshot
        run: |
          mkdir -p screenshots
          xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "screenshots/mailmeil-$(date +%Y%m%d-%H%M%S).png"

      - name: Upload screenshots
        uses: actions/upload-artifact@v4
        with:
          name: mailmeil-screenshots
          path: screenshots/*.png
          retention-days: 30
